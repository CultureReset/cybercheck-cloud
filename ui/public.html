<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public page</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13'>&#9635;</text></svg>">
<link rel="stylesheet" href="/style.css">

<main id="main">
  <h1 id="name">…</h1>
  <p class="lede" id="lede"></p>
  <div id="surfaces" class="stack"></div>
</main>

<script type="module">
  // The customer-facing page. No session, no login. Each published surface is
  // an iframe on its own app's origin, and one that fails to load leaves a gap
  // rather than taking the page with it.
  import { mountPublicSurface } from '/sdk/host.js';

  const slug = location.pathname.split('/').filter(Boolean).pop();
  const response = await fetch(`/public/${encodeURIComponent(slug)}/surfaces`);
  const { workspace, surfaces } = await response.json();

  document.getElementById('name').textContent = workspace.name ?? slug;
  document.getElementById('lede').textContent = surfaces.length
    ? ''
    : 'Nothing has been published to this page yet.';

  const container = document.getElementById('surfaces');
  for (const surface of surfaces) {
    const heading = document.createElement('h2');
    heading.textContent = surface.title ?? surface.appName;
    const frame = document.createElement('div');
    frame.className = 'surface-frame';
    container.append(heading, frame);
    mountPublicSurface(frame, { url: surface.url, title: surface.appName, height: 340 });
  }
</script>
</html>
